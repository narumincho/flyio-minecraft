app = 'flyio-minecraft'
primary_region = 'nrt'

[build]

[env]
EULA = 'TRUE'
TYPE = 'VANILLA'
VERSION = '26.2'
MEMORY = '768M'

[[mounts]]
source = 'minecraft_data'
destination = '/data'

[[vm]]
memory = '1gb'
cpu_kind = 'performance'
cpus = 2

[[services]]
internal_port = 25565
protocol = 'tcp'

[[services.ports]]
port = 25565
handlers = []

[[services.tcp_checks]]
interval = '15s'
timeout = '2s'
